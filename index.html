<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="description" content="EaseStudy — Nền tảng ghi âm bài giảng, đồng bộ slide và tạo học liệu thông minh bằng AI.">
<title>EaseStudy — Learn with clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #EDF5FF;
  --surface: #FFFFFF;
  --card: #E4EFFF;
  --pastel: #D9E8FF;
  --navy: #12192C;
  --side: #12192C;
  --text: #0F172A;
  --muted: #5B6785;
  --line: #D3E2F8;
  --brand: #2563EB;
  --brand-hover: #1D4ED8;
  --violet: #7C3AED;
  --green: #059669;
  --danger: #EF4444;
  --shadow: 0 12px 40px rgba(37, 99, 235, .10);
  --shadow-sm: 0 4px 14px rgba(15, 23, 42, .06);
  --sidebg: linear-gradient(180deg, rgba(255, 255, 255, .90), rgba(222, 236, 255, .90));
  --sidetx: #0F172A;
  --glass: rgba(255, 255, 255, .82);
  --zm: 1;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1020;
    --surface: #151C32;
    --card: #1B2440;
    --pastel: #222C4D;
    --navy: #27345F;
    --side: #070B16;
    --text: #E6ECFF;
    --muted: #9AA7C7;
    --line: #263052;
    --brand: #6E9BFF;
    --brand-hover: #93B4FF;
    --violet: #A78BFA;
    --green: #34D399;
    --shadow: 0 12px 40px rgba(0, 0, 0, .40);
    --shadow-sm: 0 4px 14px rgba(0, 0, 0, .25);
    --sidebg: linear-gradient(180deg, #0D1530, #0A1124);
    --sidetx: #E6ECFF;
    --glass: rgba(21, 28, 50, .84);
  }
  :root:not([data-theme="light"]) body {
    background-image: radial-gradient(900px 500px at 8% -8%, #1e3a8a66, transparent 60%),
                      radial-gradient(800px 460px at 100% 0, #0e749044, transparent 55%);
  }
}

:root[data-theme="dark"] {
  --bg: #0B1020;
  --surface: #151C32;
  --card: #1B2440;
  --pastel: #222C4D;
  --navy: #27345F;
  --side: #070B16;
  --text: #E6ECFF;
  --muted: #9AA7C7;
  --line: #263052;
  --brand: #6E9BFF;
  --brand-hover: #93B4FF;
  --violet: #A78BFA;
  --green: #34D399;
  --shadow: 0 12px 40px rgba(0, 0, 0, .40);
  --shadow-sm: 0 4px 14px rgba(0, 0, 0, .25);
  --sidebg: linear-gradient(180deg, #0D1530, #0A1124);
  --sidetx: #E6ECFF;
  --glass: rgba(21, 28, 50, .84);
}
:root[data-theme="dark"] body {
  background-image: radial-gradient(900px 500px at 8% -8%, #1e3a8a66, transparent 60%),
                    radial-gradient(800px 460px at 100% 0, #0e749044, transparent 55%);
}

* { box-sizing: border-box; }
html {
  height: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
  font-size: calc(15px * var(--zm, 1));
}
body {
  margin: 0;
  min-height: 100%;
  background: radial-gradient(900px 500px at 8% -8%, color-mix(in srgb, #93C5FD 45%, transparent), transparent 60%),
              radial-gradient(800px 460px at 100% 0, color-mix(in srgb, #7DD3FC 35%, transparent), transparent 55%),
              var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font: 1rem/1.55 'Plus Jakarta Sans', Inter, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

h1 { font-size: 2rem; font-weight: 800; margin: 4px 0 0; letter-spacing: -.025em; }
h2 { font-size: 1.25rem; font-weight: 700; margin: 32px 0 14px; letter-spacing: -.01em; }
h3 { margin: 0; font-weight: 700; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* Layout */
.app { display: flex; min-height: 100vh; }
.side {
  width: 256px;
  flex: none;
  background: var(--sidebg);
  color: var(--sidetx);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 24px 20px;
  position: sticky;
  top: 0;
  align-self: flex-start;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  z-index: 10;
}
@media (min-width: 901px) {
  .side {
    margin: 16px 0 16px 16px;
    height: calc(100dvh - 32px);
    border-radius: 28px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
}

.logo { display: flex; gap: 12px; align-items: center; padding: 0 4px; }
.logo i {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: linear-gradient(135deg, #2563EB, #7C3AED);
  color: #fff;
  display: grid;
  place-items: center;
  font-style: normal;
  font-size: 20px;
  box-shadow: 0 8px 20px rgba(37, 99, 235, .35);
}
.logo b { font-size: 1.2rem; display: block; line-height: 1.1; letter-spacing: -.02em; }
.logo small { font-size: .65rem; letter-spacing: .18em; color: var(--muted); font-weight: 700; }

.nav { margin-top: 32px; display: grid; gap: 6px; flex: 1; align-content: start; }
.nav button {
  text-align: left;
  padding: 12px 16px;
  border-radius: 16px;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background .15s, color .15s, transform .15s;
}
.nav button:hover { background: color-mix(in srgb, var(--brand) 10%, transparent); color: var(--text); }
.nav .on {
  background: var(--surface);
  color: var(--brand);
  box-shadow: var(--shadow-sm);
  font-weight: 700;
}
.nav .up {
  margin-top: 12px;
  background: linear-gradient(135deg, #2563EB, #7C3AED);
  color: #fff !important;
  font-weight: 700;
  white-space: normal;
  box-shadow: 0 8px 24px rgba(37, 99, 235, .3);
}
.nav .up:hover { opacity: .95; transform: translateY(-1px); }

main {
  flex: 1;
  min-width: 0;
  padding: 28px 28px 60px;
  max-width: 1200px;
  margin: 0 auto;
}
main > * { animation: rise .35s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.eyebrow { margin: 0; font-size: .75rem; font-weight: 800; letter-spacing: .16em; color: var(--brand); text-transform: uppercase; }

/* Grids & Panels */
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 20px; }
.stat-card {
  background: var(--glass);
  backdrop-filter: blur(10px);
  border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
  border-radius: 20px;
  padding: 16px 18px;
  box-shadow: var(--shadow-sm);
}
.stat-card small { font-size: .78rem; color: var(--muted); font-weight: 600; display: block; }
.stat-card b { font-size: 1.5rem; font-weight: 800; color: var(--text); display: block; margin-top: 4px; }

.split { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; align-items: start; }
.panel, .create {
  background: var(--glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 22px;
}

/* Lecture Cards */
.lcard-wrap { position: relative; display: flex; }
.lcard {
  position: relative;
  text-align: left;
  background: linear-gradient(135deg, var(--surface), var(--card));
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 22px 22px 22px 28px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  width: 100%;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.lcard:hover {
  transform: translateY(-3px);
  box-shadow: 0 18px 44px rgba(37, 99, 235, .16);
  border-color: color-mix(in srgb, var(--brand) 40%, var(--line));
}
.lcard:before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--c); }
.lcard h3 { font-size: 1.25rem; margin: 12px 0 4px; padding-right: 28px; }
.lcard p { margin: 0; color: var(--muted); font-size: .9rem; }
.del-lec {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 14px;
  opacity: 0;
  transition: opacity .15s, background .15s, color .15s;
  z-index: 2;
}
.lcard-wrap:hover .del-lec, .del-lec:focus-visible { opacity: 1; }
.del-lec:hover { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }

.blue { --c: var(--brand); }
.purple { --c: var(--violet); }
.green { --c: var(--green); }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 99px;
  font-size: .78rem;
  font-weight: 700;
  background: color-mix(in srgb, var(--c) 14%, transparent);
  color: var(--c);
}

/* Upload & Buttons */
.create { border: 2px dashed color-mix(in srgb, var(--brand) 45%, transparent); padding: 24px; }
.drop {
  background: var(--card);
  border: 2px dashed transparent;
  border-radius: 20px;
  padding: 32px 20px;
  text-align: center;
  display: grid;
  gap: 8px;
  justify-items: center;
  transition: border-color .2s, background .2s;
  cursor: pointer;
}
.drop.over, .drop:hover { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 8%, var(--card)); }

.pri {
  background: linear-gradient(135deg, #3B82F6, #2563EB);
  color: #fff;
  padding: 11px 20px;
  border-radius: 14px;
  font-weight: 700;
  box-shadow: 0 8px 22px rgba(37, 99, 235, .32);
  transition: transform .15s, box-shadow .15s;
}
.pri:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(37, 99, 235, .42); }
.sec {
  background: var(--pastel);
  color: var(--brand);
  padding: 11px 18px;
  border-radius: 14px;
  font-weight: 700;
  transition: transform .15s, background .15s;
}
.sec:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--brand) 18%, var(--pastel)); }
.ghost {
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  padding: 9px 16px;
  border-radius: 14px;
  font-weight: 600;
  transition: transform .15s, border-color .15s;
}
.ghost:hover { transform: translateY(-1px); border-color: var(--brand); }
.white {
  background: #fff;
  color: #12192C;
  padding: 10px 16px;
  border-radius: 14px;
  font-weight: 700;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
  transition: transform .15s;
}
.white:hover { transform: translateY(-1px); }

.badge {
  margin-left: auto;
  font-size: .75rem;
  font-weight: 800;
  padding: 5px 12px;
  border-radius: 99px;
  background: color-mix(in srgb, var(--green) 15%, transparent);
  color: var(--green);
}
.fine { margin: 14px 0 0; font-size: .8rem; color: var(--muted); }

/* Slide Viewer */
.viewer { display: flex; flex-direction: column; padding: 0; overflow: hidden; min-height: 520px; }
.bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  gap: 8px;
  flex-wrap: wrap;
  background: var(--surface);
}
.ib {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  font-size: 18px;
  display: inline-grid;
  place-items: center;
  transition: transform .15s, border-color .15s;
}
.ib:hover { transform: translateY(-1px); border-color: var(--brand); }
.stage {
  flex: 1;
  background: var(--card);
  position: relative;
  min-height: 440px;
  display: grid;
  place-items: center;
  padding: 24px;
  overflow: auto;
}
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.slide {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 36px;
  width: 100%;
  max-width: 640px;
  aspect-ratio: 16 / 10;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.slide small { color: var(--brand); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.slide h3 { font-size: 1.65em; margin: .35em 0 .6em; line-height: 1.25; }
.slide ul { margin: 0; padding-left: 1.2em; }
.slide li { font-size: 1.05em; margin: .4em 0; color: var(--text); }

/* Live Column */
.col { display: grid; gap: 16px; grid-template-rows: auto minmax(260px, 1fr) auto; min-width: 0; }
.mic {
  background: linear-gradient(135deg, #1E3A8A, #2563EB);
  color: #fff;
  border-radius: 24px;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  box-shadow: 0 12px 32px rgba(37, 99, 235, .28);
}
.mic .white { margin-left: auto; }
.mic-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .2);
  border: 2px solid rgba(255, 255, 255, .4);
  color: #fff;
  font-size: 20px;
  display: grid;
  place-items: center;
  transition: transform .15s, background .2s;
}
.mic-btn.on {
  background: #EF4444;
  border-color: #FCA5A5;
  animation: pulse 1.6s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, .6); }
  70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
.mic small { display: block; color: rgba(255, 255, 255, .8); font-size: .78rem; }
.mic select { background: rgba(255, 255, 255, .16); color: #fff; border-color: rgba(255, 255, 255, .3); padding: 8px 12px; }
.mic option { color: #0F172A; background: #fff; }

.tr { display: flex; flex-direction: column; min-height: 0; }
.tr ul {
  list-style: none;
  margin: 0;
  padding: 0;
  overflow: auto;
  max-height: 310px;
  display: grid;
  gap: 8px;
  align-content: start;
}
.tr li button {
  text-align: left;
  width: 100%;
  padding: 8px 10px;
  border-radius: 12px;
  transition: background .15s;
}
.tr li button:hover { background: var(--card); }
.ts { color: var(--brand); font-weight: 700; font-size: .78rem; margin-right: 8px; }
.interim { color: var(--muted); font-style: italic; padding: 6px 10px; }
.addf { display: flex; gap: 8px; margin: 12px 0; }
.addf input { flex: 1; }

.terms { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 18px; }
.terms h2 { margin: 0 0 10px; font-size: 1rem; }
.terms dl { margin: 0; }
.terms dt { font-weight: 700; color: var(--text); margin-top: 6px; }
.terms dd { margin: 2px 0 8px; color: var(--muted); font-size: .9rem; }

/* Study Pack & Review */
.pack { max-height: calc(100dvh - 64px); overflow: auto; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.tabs button {
  padding: 9px 16px;
  border-radius: 14px;
  background: var(--card);
  font-weight: 700;
  font-size: .9rem;
  color: var(--muted);
  transition: all .15s;
}
.tabs [aria-selected="true"] { background: var(--brand); color: #fff; box-shadow: 0 6px 16px rgba(37, 99, 235, .28); }

.note {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 12px;
}
.note p { margin: 6px 0; font-size: .95rem; }
.def {
  color: var(--brand);
  font-weight: 600;
  background: color-mix(in srgb, var(--brand) 10%, transparent);
  padding: 8px 12px;
  border-radius: 12px;
  border-left: 3px solid var(--brand);
}
.jump {
  margin-top: 6px;
  padding: 6px 12px;
  border-radius: 99px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--brand);
  font-size: .78rem;
  font-weight: 700;
  transition: border-color .15s, transform .15s;
}
.jump:hover { border-color: var(--brand); transform: translateY(-1px); }
.jump.active { background: var(--brand); color: #fff; border-color: var(--brand); }

.opt {
  display: block;
  width: 100%;
  text-align: left;
  padding: 11px 14px;
  margin-top: 8px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-weight: 500;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--brand); }
.opt.ok { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); border-color: var(--green); font-weight: 700; }
.opt.bad { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); border-color: var(--danger); }
.opt.dim { opacity: .55; }

label { display: grid; gap: 6px; font-weight: 600; font-size: .92rem; }
input, select {
  padding: 10px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font: inherit;
  min-width: 0;
}
input:focus, select:focus { outline: 2px solid var(--brand); border-color: transparent; }

.prog { height: 12px; border-radius: 99px; background: var(--card); overflow: hidden; margin: 16px 0; }
.prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #2563EB, #7C3AED); transition: width .2s ease; }

.ln { padding: 8px 10px; border-radius: 14px; margin-bottom: 4px; border: 1px solid transparent; transition: background .15s; }
.ln:hover { background: color-mix(in srgb, var(--card) 60%, transparent); }
.ln button { text-align: left; width: 100%; }
.ln.sel { background: var(--card); border-color: var(--line); }

.fc {
  width: 100%;
  min-height: 220px;
  margin: 12px 0;
  padding: 32px 24px;
  border-radius: 24px;
  background: linear-gradient(135deg, var(--surface), var(--card));
  border: 2px solid var(--line);
  box-shadow: var(--shadow-sm);
  font-size: 1.2rem;
  font-weight: 700;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  transition: transform .2s, border-color .2s;
}
.fc:hover { border-color: var(--brand); transform: translateY(-2px); }
.fc small { font-size: .75rem; text-transform: uppercase; letter-spacing: .12em; color: var(--brand); font-weight: 800; }

/* Pricing */
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-top: 24px; }
.plan {
  background: var(--glass);
  backdrop-filter: blur(12px);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 24px 22px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border: 2px solid var(--line);
  position: relative;
  transition: transform .2s;
}
.plan:hover { transform: translateY(-4px); }
.plan.cur { border-color: var(--brand); }
.plan.rec {
  border-color: var(--violet);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--violet) 20%, transparent), var(--shadow);
}
.plan b { font-size: 1.3rem; }
.plan .pr { font-size: 1.75rem; font-weight: 800; color: var(--text); }
.plan .pr small { font-size: .85rem; font-weight: 500; color: var(--muted); }
.plan ul { margin: 8px 0; padding-left: 18px; color: var(--muted); font-size: .92rem; flex: 1; display: grid; gap: 6px; align-content: start; }
.plan button { margin-top: auto; width: 100%; }
.rb {
  position: absolute;
  top: -13px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, #7C3AED, #2563EB);
  color: #fff;
  font-size: .7rem;
  font-weight: 800;
  letter-spacing: .08em;
  padding: 4px 12px;
  border-radius: 99px;
  white-space: nowrap;
}
.old { text-decoration: line-through; color: var(--muted); font-weight: 600; font-size: .9rem; }

/* Modal & Toast */

const warn = () => {
  S.live = false;
  try { rec && rec.stop(); } catch {}
  micUI();
  const w = $('#mw');
  if (w) w.hidden = false;
};

function mic() {
  if (S.live) {
    stopAll();
    S.interim = '';
    drawTr();
    return micUI();
  }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) return toast('Trình duyệt này chưa hỗ trợ Web Speech API. Hãy dùng Chrome/Edge, hoặc bấm “Phát bài giảng mẫu”.');
  rec = new R();
  rec.lang = P.lang;
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = e => {
    let p = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) {
        S.interim = '';
        addSeg(r[0].transcript.trim());
      } else {
        p += r[0].transcript;
      }
    }
    S.interim = p;
    drawTr();
  };
  rec.onend = () => { if (S.live) try { rec.start(); } catch {} };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') warn();
  };
  S.live = true;
  S.t0 = S.t0 || Date.now();
  try { rec.start(); } catch {}
  micUI();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) warn();
  else navigator.mediaDevices.getUserMedia({ audio: true }).then(s => s.getTracks().forEach(t => t.stop())).catch(warn);
}

        <button role="tab" data-a="tab" data-v="map">🗺 Bản đồ bài giảng</button>

        <button role="tab" data-a="tab" data-v="flash">🗂 Flashcard</button>

      </div>
      <div id="pk"></div>
    </section>
    ${viewer()}
  </div>`;
  drawSlide();
  drawPack();
}

function mk(sh) {
  const T = (!S.pdf && S.deck.terms) || [];
  const fm = n => (S.segs.find(s => s.slide === n) || { ms: 0 }).ms;
  if (T.length) {
    S.cards = T.map(t => ({ f: t.term, b: t.def, slide: t.slide, ms: fm(t.slide) }));
    S.quiz = T.map(t => ({
      q: 'Khái niệm nào được mô tả: “' + t.def + '”?',
      opts: sh(T.map(x => x.term)),
      a: t.term,
      slide: t.slide,
      ms: fm(t.slide)
    }));
  } else {
    const W = s => s.text.split(/\s+/).map(w => w.replace(/[.,;?!""''()]/g, '')).filter(w => w.length > 3).sort((a, b) => b.length - a.length)[0];
    const L = S.segs.filter(W).slice(0, 6);
    const fallbackPool = ['ngân sách', 'thị trường', 'cân bằng', 'chi phí', 'lợi ích', 'nguyên lý'];
    S.cards = L.map(s => {
      const target = W(s);
      return { f: s.text.replace(target, '_____'), b: target + ' — ' + s.text, slide: s.slide, ms: s.ms };
    });
    S.quiz = L.map(s => {
      const target = W(s);
      const others = [...new Set([...L.map(W), ...fallbackPool])].filter(w => w && w.toLowerCase() !== target.toLowerCase()).slice(0, 3);
      return {
        q: 'Điền từ còn thiếu vào câu giảng: “' + s.text.replace(target, '_____') + '”',
        opts: sh([target, ...others]),
        a: target,
        slide: s.slide,
        ms: s.ms
      };
    });
  }
  S.fi = 0;
  S.flip = 0;
}

function drawPack() {
  const p = $('#pk');
  if (!p) return;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === S.tab));

  if (S.tab === 'map') return dMap(p);
  if (S.tab === 'flash') return dFlash(p);

  if (S.tab === 'notes') {
    const by = {};
    S.segs.forEach(s => (by[s.slide] ??= []).push(s));
    const ks = Object.keys(by).map(Number).sort((a, b) => a - b);
    p.innerHTML = ks.length
      ? `<div class="between" style="margin-bottom:10px">
          <div class="row">
            <button class="jump ${S.sl === 'vi' ? 'active' : ''}" data-a="sl" data-v="vi">🇻🇳 Tiếng Việt</button>
            <button class="jump ${S.sl === 'en' ? 'active' : ''}" data-a="sl" data-v="en">🇬🇧 English</button>
          </div>
          <small class="muted">${ks.length} phần ghi chú</small>
        </div>` +
        ks.map(n => {
          const sl = !S.pdf && S.deck.slides[n - 1];
          const tm = !S.pdf && S.deck.terms.find(x => x.slide === n);
          return `<article class="note">
            <h3>${esc(sl ? sl.t : 'Slide ' + n)}</h3>
            ${tm ? `<p class="def">💡 <b>${esc(tm.term)}:</b> ${esc(tm.def)}</p>` : ''}
            ${by[n].map(s => `<p>${esc(S.sl === 'en' && s.en ? s.en : s.text)}</p>`).join('')}
            <div class="row" style="margin-top:10px">
              <button class="jump" data-a="jump" data-n="${n}">📍 Slide ${n} · ${fmt(by[n][0].ms)}</button>
              <button class="jump" data-a="tts" data-n="${n}">🔊 Đọc to</button>
            </div>
          </article>`;
        }).join('')
      : '<div class="note"><p class="muted">Chưa có dữ liệu lời giảng cho bài này. Hãy bấm “Bắt đầu ghi âm” để thu thập phụ đề hoặc phát bài mẫu.</p><button class="pri" style="margin-top:8px" data-a="newlive">🎙 Vào phòng Live</button></div>';
    return;
  }

  // Quiz tab
  if (S.quiz.length) {
    const N = S.quiz.length;
    const n = Object.keys(S.picked).length;
    const ok = S.quiz.filter((q, i) => S.picked[i] !== undefined && q.opts[S.picked[i]] === q.a).length;
    const r = ok / N;
    const msg = n < N
      ? `Đã trả lời ${n}/${N} câu · Đúng ${ok}`
      : r >= .8
        ? `🎉 Xuất sắc! Đúng ${ok}/${N} câu (${Math.round(r * 100)}%)`
        : r >= .5
          ? `👍 Khá tốt! Đúng ${ok}/${N} câu. Ôn lại các câu sai nhé!`
          : `🌱 Đúng ${ok}/${N} câu. Hãy lật lại Flashcard để nắm chắc hơn!`;

    p.innerHTML = `
      <div class="score" role="status">
        <span>${msg}</span>
        ${n > 0 ? `<button class="jump" style="margin:0" data-a="retryquiz">🔄 Làm lại</button>` : ''}
      </div>` +
      S.quiz.map((q, i) => {
        const s = S.picked[i];
        return `<article class="note">
          <b>Câu ${i + 1}. ${esc(q.q)}</b>
          ${q.opts.map((o, j) => {
            const c = s === undefined ? '' : o === q.a ? 'ok' : j === s ? 'bad' : 'dim';
            return `<button class="opt ${c}" ${s !== undefined ? 'disabled' : ''} data-a="pick" data-q="${i}" data-o="${j}">${esc(o)}</button>`;
          }).join('')}
          ${s !== undefined ? `<button class="jump" data-a="src" data-s="${q.slide}" data-m="${q.ms}">▶ Xem slide &amp; nghe đoạn gốc</button>` : ''}
        </article>`;
      }).join('');
  } else {
    p.innerHTML = '<p class="muted">Chưa có câu hỏi trắc nghiệm cho bài này. Hãy thu âm lời giảng hoặc mở bài mẫu Kinh tế vi mô.</p>';
  }
}

function dMap(p) {
  if (!S.segs.length) {
    p.innerHTML = '<div class="note"><p class="muted">Bài học này chưa có bản ghi transcript.</p><button class="pri" style="margin-top:8px" data-a="newlive">🎙 Bắt đầu ghi âm bài giảng</button></div>';
    return;
  }
  p.innerHTML = '<p class="muted" style="font-size:.85rem;margin-top:0">Bấm vào bất kỳ mốc thời gian nào để đồng bộ tới đúng Slide và nghe đọc lại câu giảng đó.</p>' +
    S.segs.map((s, i) => `
      <div class="ln ${S.sel === i ? 'sel' : ''}">
        <button data-a="line" data-i="${i}">
          <span class="ts">${fmt(s.ms)} · Slide ${s.slide}</span>${esc(s.text)}
        </button>
        ${S.sel === i ? `<button class="jump" data-a="src" data-s="${s.slide}" data-m="${s.ms}">🔊 Nghe đọc lại</button>` : ''}
      </div>`).join('');
}

function dFlash(p) {
  const c = S.cards[S.fi];
  if (!c) {
    p.innerHTML = '<p class="muted">Chưa đủ thuật ngữ hoặc lời giảng để tạo Flashcard.</p>';
    return;
  }
  p.innerHTML = `
    <div class="between">
      <span class="muted" style="font-size:.88rem;font-weight:600">Thẻ ${S.fi + 1} / ${S.cards.length}</span>
      <small class="muted">Nhấn vào thẻ hoặc phím Space để lật</small>
    </div>
    <button class="fc" data-a="flip">
      <small>${S.flip ? 'Định nghĩa / Đáp án' : 'Thuật ngữ / Câu hỏi'}</small>
      <div>${esc(S.flip ? c.b : c.f)}</div>
    </button>
    <div class="between">
      <div class="row">
        <button class="ib" data-a="fp" aria-label="Thẻ trước">‹</button>
        <button class="ib" data-a="fn" aria-label="Thẻ sau">›</button>
      </div>
      <button class="jump" style="margin:0" data-a="src" data-s="${c.slide}" data-m="${c.ms}">📍 Xem ở Slide ${c.slide}</button>
    </div>`;
}

function exportNotes() {
  if (!S.segs.length) return toast('Chưa có nội dung ghi chú để xuất file.');
  const curLec = P.lec.find(x => x.id == S.curLecId);
  const title = curLec ? curLec.title : S.deck.title;
  const by = {};
  S.segs.forEach(s => (by[s.slide] ??= []).push(s));
  const ks = Object.keys(by).map(Number).sort((a, b) => a - b);

  let md = `# ${title} — EaseStudy Smart Notes\nNgày xuất: ${new Date().toLocaleDateString('vi-VN')}\n\n`;
  ks.forEach(n => {
    const sl = !S.pdf && S.deck.slides[n - 1];
    const tm = !S.pdf && S.deck.terms.find(x => x.slide === n);
    md += `## Slide ${n}${sl ? ': ' + sl.t : ''}\n`;
    if (tm) md += `> **Thuật ngữ (${tm.term}):** ${tm.def}\n\n`;
    by[n].forEach(s => {
      md += `- [${fmt(s.ms)}] ${S.sl === 'en' && s.en ? s.en : s.text}\n`;
    });
    md += '\n';
  });

  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${title.toLowerCase().replace(/\s+/g, '-')}-notes.md`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('✓ Đã tải xuống file ghi chú (.md)');
}

function chit(q) {
  const l = q.toLowerCase().trim();
  const R = a => a[Math.floor(Math.random() * a.length)];
  if (/^(xin )?chào|^hello|^hi$|^hey|^alo/.test(l)) return R(['Chào ' + P.name + '! Hôm nay việc học của bạn thế nào?', 'Hey ' + P.name + '! Mình luôn sẵn sàng hỗ trợ bạn ôn bài đây!']);
  if (/khỏe không|khoẻ không|how are you|dạo này (sao|thế nào)/.test(l)) return 'Cảm ơn bạn, bộ vi xử lý của mình vẫn chạy mượt 100%! Còn bạn thì sao, bài vở có căng thẳng lắm không?';
  if (/bạn là ai|tên gì|who are you/.test(l)) return 'Mình là Ease 🤖 — trợ lý học tập AI của EaseStudy. Mình giúp bạn tóm tắt slide, giải nghĩa thuật ngữ và tạo câu hỏi ôn thi.';
  if (/cảm ơn|cám ơn|thanks|thank you/.test(l)) return R(['Không có chi! Chúc bạn đạt điểm A+ môn này nhé 😊', 'Rất vui vì giúp được bạn!']);
  if (/chán|buồn|mệt|stress|áp lực|nản/.test(l)) return 'Nghe có vẻ bạn đang quá tải rồi. Hãy tạm rời màn hình 5 phút, uống một cốc nước mát và hít thở sâu nhé. Mọi kiến thức khó đều có thể chia nhỏ ra để chinh phục từng chút một!';
  if (/chuyện cười|joke|kể.*vui|đùa/.test(l)) return R(['Tại sao sinh viên Kinh tế không bao giờ bị lạc đường? Vì lúc nào họ cũng tính toán “chi phí cơ hội” trước khi rẽ! 😄', 'Quy luật lợi ích cận biên giảm dần: Ly trà sữa đầu tiên là chân ái, đến ly thứ 5 trong ngày thì chỉ thấy… đau ví! 😅']);
  if (/mấy giờ|ngày mấy|hôm nay là|thứ mấy/.test(l)) {
    const d = new Date();
    return 'Hiện tại là ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ', ' + d.toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'numeric', year: 'numeric' }) + '.';
  }
  return '';
}

function bot(q) {
  const c = chit(q);
  if (c) return c;
  const l = q.toLowerCase();
  const sl = !S.pdf && S.deck.slides[S.slide - 1];
  const T = S.pdf ? [] : S.deck.terms;
  const here = S.segs.filter(s => s.slide === S.slide);

  if (l.includes('tóm tắt')) {
    if (!sl && !here.length) return 'Slide ' + S.slide + ' hiện chưa có dữ liệu văn bản để tóm tắt.';
    return '📌 Tóm tắt Slide ' + S.slide + (sl ? ' (' + sl.t + '):\n• ' + sl.b.join('\n• ') : '') + (here.length ? '\n\n🎙 Ý chính giảng viên nhấn mạnh:\n“' + here.slice(0, 2).map(s => s.text).join(' ') + '”' : '');
  }
  if (/câu hỏi|ôn tập|quiz|kiểm tra/.test(l)) {
    const A = T.filter(t => t.slide === S.slide);
    const L = (A.length ? A : T).slice(0, 3);
    if (!L.length) return 'Mình chưa có danh sách thuật ngữ cho bài này. Bạn hãy thử mở bài mẫu Kinh tế vi mô nhé!';
    return L.map((t, i) => `Câu ${i + 1}: “${t.def}” là định nghĩa của khái niệm nào?`).join('\n') + '\n\n💡 Đáp án: ' + L.map((t, i) => `${i + 1}) ${t.term}`).join(' | ');
  }
  const hit = [...T].sort((a, b) => b.term.length - a.term.length).find(t => {
    const k = t.term.toLowerCase();
    return l.includes(k) || l.includes(k.replace(/\s*\(.*\)/, ''));
  });
  if (hit) {
    const e = EXT.find(x => hit.term.toLowerCase().includes(x.k));
    return `📘 ${hit.term} (Slide ${hit.slide}):\n${hit.def}${e ? '\n\n✨ ' + e.x : ''}`;
  }
  if (/thuật ngữ|giải thích|khó/.test(l)) {
    const L = T.filter(t => t.slide === S.slide);
    const A = L.length ? L : T;
    return A.length
      ? (L.length ? `Thuật ngữ trọng tâm ở Slide ${S.slide}:\n` : 'Các thuật ngữ cốt lõi của bài học:\n') + A.map(t => `• ${t.term}: ${t.def}`).join('\n')
      : 'Chưa có thuật ngữ nào được trích xuất cho bài này.';
  }
  return 'Mình đã ghi nhận câu hỏi của bạn! Trong bản chạy trình duyệt này, bạn có thể hỏi mình: “Tóm tắt slide này”, “Giải thích thỏa dụng biên”, hoặc “Tạo câu hỏi ôn tập” nhé.';
}

function positionTourSpotlight() {
  const sp = $('#sp'), b = $('#bub'), tb = $('#tb');
  if (!sp || !b || !tb) return;
  const d = TS[ti];
  const el = d ? document.querySelector(d.s) : null;
  let low = false;
  if (el) {
    const r = el.getBoundingClientRect();
    const p = 8;
    Object.assign(sp.style, {
      display: 'block',
      left: Math.max(4, r.left - p) + 'px',
      top: Math.max(4, r.top - p) + 'px',
      width: Math.min(window.innerWidth - 8, r.width + 2 * p) + 'px',
      height: r.height + 2 * p + 'px'
    });
    tb.style.background = 'transparent';
    low = (r.top + r.height / 2) < (window.innerHeight / 2);
  } else {
    sp.style.display = 'none';
    tb.style.background = 'rgba(0,0,0,.7)';
  }
  b.style.top = low ? 'auto' : 'calc(16px + env(safe-area-inset-top,0px))';
  b.style.bottom = low ? 'calc(16px + env(safe-area-inset-bottom,0px))' : 'auto';
}

  line: el => { S.sel = +el.dataset.i; go(S.segs[S.sel].slide); dMap($('#pk')); },
  src: el => src(el.dataset.s, el.dataset.m),
  tts: el => say(S.segs.filter(s => s.slide === +el.dataset.n).map(s => S.sl === 'en' && s.en ? s.en : s.text).join('. '), S.sl === 'en' ? 'en-US' : 'vi-VN'),
  sl: el => { S.sl = el.dataset.v; drawPack(); },
  flip: () => { S.flip = !S.flip; drawPack(); },
  fp: () => { S.fi = (S.fi + S.cards.length - 1) % S.cards.length; S.flip = 0; drawPack(); },
  fn: () => { S.fi = (S.fi + 1) % S.cards.length; S.flip = 0; drawPack(); },
  buy: el => buy(+el.dataset.i),
  paid: el => pay(+el.dataset.i),
  reset: () => {
    try { localStorage.removeItem('es'); } catch {}
    location.reload();
  },
  mictest: async () => {
    const r = $('#mr');
    if (!r) return;
    r.textContent = 'Đang kiểm tra…';
    try {
      const st = await navigator.mediaDevices.getUserMedia({ audio: true });
      st.getTracks().forEach(t => t.stop());
      r.textContent = '✓ Micro hoạt động tốt!';
      r.style.color = 'var(--green)';
    } catch {
      r.textContent = '✕ Không truy cập được Micro. Hãy cấp quyền trên trình duyệt.';
      r.style.color = 'var(--danger)';
    }
  },
  menu: () => {
    const o = $('.side').classList.toggle('open');
    $('#ov').classList.toggle('on', o);
    $('#mb').setAttribute('aria-expanded', o);
  },
  tour: () => { closeMenu(); tour(0); },
  tnext: () => ti < TS.length - 1 ? tour(ti + 1) : endTour(),
  tprev: () => tour(ti - 1),
  tskip: endTour,
  chat: () => {
    const c = $('#chat');
    const o = c.hidden;
    c.hidden = !o;
    $('#cbtn').setAttribute('aria-expanded', o);
    if (o) $('#ci')?.focus();
  },
  chip: el => ask(el.dataset.q),
  set: el => {
    D[el.dataset.k] = el.dataset.k === 'fs' ? +el.dataset.v : el.dataset.v;
    applyPrefs(D);
    drawSet();
  },
  scancel: () => { applyPrefs(P); settings(); },
  ssave: () => {
    D.name = (D.name || '').trim() || 'Learner';
    Object.assign(P, D);
    save();
    applyPrefs(P);
    toast('✓ Đã lưu cài đặt thành công.');
    settings();
  },
  logout: () => { P.user = null; save(); showAuth(); },
  amode: el => authUI(el.dataset.m),
  soc: el => {
    const v = el.dataset.v;
    el.disabled = true;
    el.innerHTML = '<span class="spin"></span> Đang kết nối…';
    setTimeout(() => login({ name: 'Learner', email: '', via: v }), 650);
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  if (ACTIONS[a]) ACTIONS[a](el);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    modal();
    if (!$('#chat').hidden) ACTIONS.chat();
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (S.view === 'live' || S.view === 'review') {
    if (e.key === 'ArrowLeft') {
      if (S.view === 'review' && S.tab === 'flash' && S.cards.length) ACTIONS.fp();
      else go(S.slide - 1);
    } else if (e.key === 'ArrowRight') {
      if (S.view === 'review' && S.tab === 'flash' && S.cards.length) ACTIONS.fn();
      else go(S.slide + 1);
    } else if (e.key === ' ' && S.view === 'review' && S.tab === 'flash' && S.cards.length) {
      e.preventDefault();
      ACTIONS.flip();
    }
  }
});

/* Boot Application */
applyPrefs(P);
updPlan();
home();
if (P.user) {
  if (!P.tour) setTimeout(() => tour(0), 600);
} else {
  showAuth();
}
</script>
</body>
</html>
