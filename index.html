<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<meta name="description" content="EaseStudy — Nền tảng ghi âm bài giảng, đồng bộ slide và tạo học liệu thông minh bằng AI.">
<title>EaseStudy — Learn with clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #EDF5FF;
  --surface: #FFFFFF;
  --card: #E4EFFF;
  --pastel: #D9E8FF;
  --navy: #12192C;
  --side: #12192C;
  --text: #0F172A;
  --muted: #5B6785;
  --line: #D3E2F8;
  --brand: #2563EB;
  --brand-hover: #1D4ED8;
  --violet: #7C3AED;
  --green: #059669;
  --amber: #D97706;
  --danger: #EF4444;
  --shadow: 0 14px 44px rgba(37, 99, 235, .10);
  --shadow-sm: 0 4px 16px rgba(15, 23, 42, .06);
  --sidebg: linear-gradient(180deg, rgba(255, 255, 255, .94), rgba(226, 239, 255, .94));
  --sidetx: #0F172A;
  --glass: rgba(255, 255, 255, .86);
  --zm: 1;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090D1A;
    --surface: #131B2E;
    --card: #1A243D;
    --pastel: #222F52;
    --navy: #27345F;
    --side: #070B16;
    --text: #E6ECFF;
    --muted: #9AA7C7;
    --line: #253154;
    --brand: #6E9BFF;
    --brand-hover: #93B4FF;
    --violet: #A78BFA;
    --green: #34D399;
    --amber: #FBBF24;
    --shadow: 0 14px 44px rgba(0, 0, 0, .48);
    --shadow-sm: 0 4px 16px rgba(0, 0, 0, .32);
    --sidebg: linear-gradient(180deg, #0D1530, #090E20);
    --sidetx: #E6ECFF;
    --glass: rgba(19, 27, 46, .88);
  }
  :root:not([data-theme="light"]) body {
    background-image: radial-gradient(900px 500px at 8% -8%, #1e3a8a66, transparent 60%),
                      radial-gradient(800px 460px at 100% 0, #0e749044, transparent 55%);
  }
}

:root[data-theme="dark"] {
  --bg: #090D1A;
  --surface: #131B2E;
  --card: #1A243D;
  --pastel: #222F52;
  --navy: #27345F;
  --side: #070B16;
  --text: #E6ECFF;
  --muted: #9AA7C7;
  --line: #253154;
  --brand: #6E9BFF;
  --brand-hover: #93B4FF;
  --violet: #A78BFA;
  --green: #34D399;
  --amber: #FBBF24;
  --shadow: 0 14px 44px rgba(0, 0, 0, .48);
  --shadow-sm: 0 4px 16px rgba(0, 0, 0, .32);
  --sidebg: linear-gradient(180deg, #0D1530, #090E20);
  --sidetx: #E6ECFF;
  --glass: rgba(19, 27, 46, .88);
}
:root[data-theme="dark"] body {
  background-image: radial-gradient(900px 500px at 8% -8%, #1e3a8a66, transparent 60%),
                    radial-gradient(800px 460px at 100% 0, #0e749044, transparent 55%);
}

* { box-sizing: border-box; }
html {
  height: 100%;
  scroll-padding-top: env(safe-area-inset-top, 0px);
  font-size: calc(15px * var(--zm, 1));
}
body {
  margin: 0;
  min-height: 100%;
  background: radial-gradient(900px 500px at 8% -8%, color-mix(in srgb, #93C5FD 48%, transparent), transparent 60%),
              radial-gradient(800px 460px at 100% 0, color-mix(in srgb, #7DD3FC 38%, transparent), transparent 55%),
              var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font: 1rem/1.55 'Plus Jakarta Sans', Inter, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

h1 { font-size: 2.05rem; font-weight: 800; margin: 4px 0 0; letter-spacing: -.028em; }
h2 { font-size: 1.25rem; font-weight: 800; margin: 30px 0 14px; letter-spacing: -.015em; }
h3 { margin: 0; font-weight: 700; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* App Shell */
.app { display: flex; min-height: 100vh; }
.side {
  width: 272px;
  flex: none;
  background: var(--sidebg);
  color: var(--sidetx);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 22px 18px;
  position: sticky;
  top: 0;
  align-self: flex-start;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  z-index: 10;
}
@media (min-width: 901px) {
  .side {
    margin: 14px 0 14px 14px;
    height: calc(100dvh - 28px);
    border-radius: 28px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }
}

.logo { display: flex; gap: 12px; align-items: center; padding: 0 6px; }
.logo i {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: linear-gradient(135deg, #2563EB, #7C3AED);
  color: #fff;
  display: grid;
  place-items: center;
  font-style: normal;
  font-size: 21px;
  box-shadow: 0 8px 22px rgba(37, 99, 235, .38);
}
.logo b { font-size: 1.25rem; display: block; line-height: 1.1; letter-spacing: -.025em; }
.logo small { font-size: .64rem; letter-spacing: .18em; color: var(--muted); font-weight: 800; }

.cmd-btn {
  margin-top: 18px;
  width: 100%;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: .85rem;
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow-sm);
  transition: border-color .15s, color .15s;
}
.cmd-btn:hover { border-color: var(--brand); color: var(--text); }
.cmd-btn kbd {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 2px 6px;
  font-size: .7rem;
  font-weight: 700;
  font-family: inherit;
}

.nav { margin-top: 16px; display: grid; gap: 5px; flex: 1; align-content: start; }
.nav button {
  text-align: left;
  padding: 11px 14px;
  border-radius: 15px;
  color: var(--muted);
  font-weight: 600;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background .15s, color .15s, transform .15s;
}
.nav button:hover { background: color-mix(in srgb, var(--brand) 10%, transparent); color: var(--text); }
.nav .on {
  background: linear-gradient(135deg, var(--surface), var(--card));
  color: var(--brand);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  font-weight: 700;
}
.nav .up {
  margin-top: 8px;
  background: linear-gradient(135deg, #2563EB, #7C3AED);
  color: #fff !important;
  font-weight: 700;
  white-space: normal;
  box-shadow: 0 8px 24px rgba(37, 99, 235, .32);
}
.nav .up:hover { opacity: .95; transform: translateY(-1px); }

/* Sidebar User Profile Card */
.u-card {
  margin-top: 14px;
  padding: 14px;
  border-radius: 20px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  display: grid;
  gap: 10px;
}
.u-top { display: flex; align-items: center; gap: 10px; }
.u-av {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, #3B82F6, #1D4ED8);
  color: #fff;
  font-weight: 800;
  display: grid;
  place-items: center;
  font-size: .95rem;
}
.u-info { min-width: 0; flex: 1; }
.u-info b { display: block; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-info small { display: block; font-size: .73rem; color: var(--brand); font-weight: 700; }
.u-meter { height: 6px; border-radius: 99px; background: var(--card); overflow: hidden; }
.u-meter i { display: block; height: 100%; background: linear-gradient(90deg, #2563EB, #7C3AED); border-radius: 99px; }

main {
  flex: 1;
  min-width: 0;
  padding: 28px 30px 72px;
  max-width: 1240px;
  margin: 0 auto;
}
main > * { animation: rise .35s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }

.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.eyebrow { margin: 0; font-size: .74rem; font-weight: 800; letter-spacing: .16em; color: var(--brand); text-transform: uppercase; }

/* Dashboard Analytics & Grids */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-top: 22px; }
.stat-card {
  background: var(--glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform .2s, box-shadow .2s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.stat-ic {
  width: 46px;
  height: 46px;
  border-radius: 15px;
  background: var(--card);
  color: var(--brand);
  display: grid;
  place-items: center;
  font-size: 22px;
  flex: none;
}
.stat-card small { font-size: .78rem; color: var(--muted); font-weight: 600; display: block; }
.stat-card b { font-size: 1.45rem; font-weight: 800; color: var(--text); display: block; margin-top: 2px; }

.dash-mid { display: grid; grid-template-columns: 1.35fr 1fr; gap: 18px; margin-top: 22px; }
.chart-bars {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  height: 120px;
  padding-top: 18px;
  margin-top: 10px;
  border-bottom: 1px solid var(--line);
}
.c-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.c-bar {
  width: 100%;
  max-width: 34px;
  border-radius: 8px 8px 3px 3px;
  background: linear-gradient(180deg, #3B82F6, #2563EB);
  transition: height .4s ease, opacity .15s;
  position: relative;
}
.c-bar:hover { opacity: .85; }
.c-col small { font-size: .72rem; color: var(--muted); font-weight: 600; }

.mast-list { display: grid; gap: 12px; margin-top: 12px; }
.mast-item { display: grid; gap: 5px; }
.mast-bar { height: 8px; border-radius: 99px; background: var(--card); overflow: hidden; }
.mast-bar i { display: block; height: 100%; border-radius: 99px; }

.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.split { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; align-items: start; }
.panel, .create {
  background: var(--glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 22px;
}

/* Lecture Cards */
.lcard-wrap { position: relative; display: flex; }
.lcard {
  position: relative;
  text-align: left;
  background: linear-gradient(135deg, var(--surface), var(--card));
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 22px 22px 22px 28px;
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.lcard:hover {
  transform: translateY(-3px);
  box-shadow: 0 18px 44px rgba(37, 99, 235, .16);
  border-color: color-mix(in srgb, var(--brand) 45%, var(--line));
}
.lcard:before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--c); }
.lcard h3 { font-size: 1.22rem; margin: 6px 0 0; padding-right: 28px; }
.lcard p { margin: 0; color: var(--muted); font-size: .88rem; }
.lcard-foot { margin-top: 8px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--line) 70%, transparent); display: flex; justify-content: space-between; align-items: center; font-size: .78rem; color: var(--muted); font-weight: 600; }

.del-lec {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 14px;
  opacity: 0;
  transition: opacity .15s, background .15s, color .15s;
  z-index: 2;
}
.lcard-wrap:hover .del-lec, .del-lec:focus-visible { opacity: 1; }
.del-lec:hover { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }

.blue { --c: var(--brand); }
.purple { --c: var(--violet); }
.green { --c: var(--green); }
.chip {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 99px;
  font-size: .76rem;
  font-weight: 700;
  background: color-mix(in srgb, var(--c) 14%, transparent);
  color: var(--c);
}

/* Upload & Buttons */
.create { border: 2px dashed color-mix(in srgb, var(--brand) 45%, transparent); padding: 24px; }
.drop {
  background: var(--card);
  border: 2px dashed transparent;
  border-radius: 20px;
  padding: 32px 20px;
  text-align: center;
  display: grid;
  gap: 8px;
  justify-items: center;
  transition: border-color .2s, background .2s;
  cursor: pointer;
}
.drop.over, .drop:hover { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 8%, var(--card)); }

.pri {
  background: linear-gradient(135deg, #3B82F6, #2563EB);
  color: #fff;
  padding: 11px 20px;
  border-radius: 14px;
  font-weight: 700;
  box-shadow: 0 8px 22px rgba(37, 99, 235, .32);
  transition: transform .15s, box-shadow .15s;
}
.pri:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(37, 99, 235, .42); }
.sec {
  background: var(--pastel);
  color: var(--brand);
  padding: 11px 18px;
  border-radius: 14px;
  font-weight: 700;
  transition: transform .15s, background .15s;
}
.sec:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--brand) 18%, var(--pastel)); }
.ghost {
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  padding: 9px 16px;
  border-radius: 14px;
  font-weight: 600;
  transition: transform .15s, border-color .15s;
}
.ghost:hover { transform: translateY(-1px); border-color: var(--brand); }
.white {
  background: #fff;
  color: #12192C;
  padding: 10px 16px;
  border-radius: 14px;
  font-weight: 700;
  box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
  transition: transform .15s;
}
.white:hover { transform: translateY(-1px); }

.badge {
  margin-left: auto;
  font-size: .74rem;
  font-weight: 800;
  padding: 5px 12px;
  border-radius: 99px;
  background: color-mix(in srgb, var(--green) 15%, transparent);
  color: var(--green);
}
.fine { margin: 14px 0 0; font-size: .8rem; color: var(--muted); }

/* Slide Viewer */
.viewer { display: flex; flex-direction: column; padding: 0; overflow: hidden; min-height: 530px; }
.viewer:fullscreen { border-radius: 0; height: 100dvh; }
.bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  gap: 8px;
  flex-wrap: wrap;
  background: var(--surface);
}
.ib {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  font-size: 16px;
  display: inline-grid;
  place-items: center;
  transition: transform .15s, border-color .15s;
}
.ib:hover { transform: translateY(-1px); border-color: var(--brand); }
.stage {
  flex: 1;
  background: var(--card);
  position: relative;
  min-height: 440px;
  display: grid;
  place-items: center;
  padding: 24px;
  overflow: auto;
}
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.slide {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 36px;
  width: 100%;
  max-width: 640px;
  aspect-ratio: 16 / 10;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.slide::after {
  content: "EaseStudy Deck";
  position: absolute;
  bottom: 14px;
  right: 20px;
  font-size: .7rem;
  font-weight: 700;
  color: var(--muted);
  opacity: .5;
}
.slide small { color: var(--brand); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.slide h3 { font-size: 1.65em; margin: .35em 0 .6em; line-height: 1.25; }
.slide ul { margin: 0; padding-left: 1.2em; }
.slide li { font-size: 1.05em; margin: .4em 0; color: var(--text); }

/* Live Column & Waveform Visualizer */
.col { display: grid; gap: 16px; grid-template-rows: auto minmax(260px, 1fr) auto; min-width: 0; }
.mic {
  background: linear-gradient(135deg, #1E3A8A, #2563EB);
  color: #fff;
  border-radius: 24px;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  box-shadow: 0 12px 32px rgba(37, 99, 235, .28);
}
.mic .white { margin-left: auto; }
.mic-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .2);
  border: 2px solid rgba(255, 255, 255, .4);
  color: #fff;
  font-size: 20px;
  display: grid;
  place-items: center;
  transition: transform .15s, background .2s;
}
.mic-btn.on {
  background: #EF4444;
  border-color: #FCA5A5;
  animation: pulse 1.6s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, .6); }
  70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
.mic small { display: block; color: rgba(255, 255, 255, .82); font-size: .78rem; }
.mic select { background: rgba(255, 255, 255, .16); color: #fff; border-color: rgba(255, 255, 255, .3); padding: 8px 12px; }
.mic option { color: #0F172A; background: #fff; }

.wave-bars { display: inline-flex; align-items: center; gap: 3px; height: 18px; margin-left: 6px; vertical-align: middle; }
.wave-bars i {
  display: block;
  width: 3px;
  height: 4px;
  border-radius: 99px;
  background: #60A5FA;
  transition: height .15s;
}
.wave-bars.active i { background: #34D399; animation: wv .8s ease-in-out infinite alternate; }
.wave-bars.active i:nth-child(2) { animation-delay: .15s; }
.wave-bars.active i:nth-child(3) { animation-delay: .3s; }
.wave-bars.active i:nth-child(4) { animation-delay: .45s; }
.wave-bars.active i:nth-child(5) { animation-delay: .2s; }
@keyframes wv { 0% { height: 4px; } 100% { height: 18px; } }

.tr { display: flex; flex-direction: column; min-height: 0; }
.tr ul {
  list-style: none;
  margin: 0;
  padding: 0;
  overflow: auto;
  max-height: 310px;
  display: grid;
  gap: 6px;
  align-content: start;
}
.tr-item {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 6px 8px;
  border-radius: 12px;
  transition: background .15s;
}
.tr-item:hover { background: var(--card); }
.tr-item .main-btn { text-align: left; flex: 1; line-height: 1.45; }
.tr-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
.tr-item:hover .tr-actions { opacity: 1; }
.tr-actions button {
  padding: 2px 6px;
  border-radius: 8px;
  font-size: .75rem;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--line);
}
.tr-actions button:hover { color: var(--brand); border-color: var(--brand); }

.ts { color: var(--brand); font-weight: 700; font-size: .78rem; margin-right: 8px; }
.interim { color: var(--muted); font-style: italic; padding: 6px 10px; }
.addf { display: flex; gap: 8px; margin: 12px 0; }
.addf input { flex: 1; }

.terms { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 18px; }
.terms h2 { margin: 0 0 10px; font-size: 1rem; }
.terms dl { margin: 0; }

}

function drawSlide() {
  const st = $('#stage');
  if (!st) return;
  const total = S.pdf || !S.deck.slides.length ? '' : ' / ' + S.deck.slides.length;
  $('#sn').textContent = 'Slide ' + S.slide + total;
  $('#zv').textContent = S.zoom + '%';
  if (S.pdf) {
    st.innerHTML = `<iframe title="Slide bài giảng" src="${S.pdf}#page=${S.slide}&zoom=${S.zoom}"></iframe>`;
  } else {
    const s = S.deck.slides[S.slide - 1] || {
      t: 'Slide ' + S.slide,
      b: ['Nội dung tóm tắt cho slide này được đồng bộ ở bảng Học liệu bên cạnh.', 'Bạn có thể tải lên file PDF gốc để đối chiếu trực quan.']

  }
  drawTerms();
}

function drawTerms() {

}

function bindDropzone() {
  const d = $('#drop');
  const fs = $('#fs');
  if (!d || !fs) return;
  ['dragover', 'dragenter'].forEach(v => d.addEventListener(v, e => { e.preventDefault(); d.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(v => d.addEventListener(v, e => { e.preventDefault(); d.classList.remove('over'); }));
  d.addEventListener('drop', e => {
    e.stopPropagation();
    takeSlide(e.dataTransfer.files[0]);
  });
  fs.onchange = e => takeSlide(e.target.files[0]);
}

function takeSlide(f) {
  if (!f) return;
  const x = f.name.split('.').pop().toLowerCase();
  if (x === 'pdf') {
    S.name = f.name;
    S.slide = 1;
    if (f.size < 3.5 * 1024 * 1024) {
      const reader = new FileReader();
      reader.onload = () => {
        S.pdf = reader.result;
        toast('✓ Đã nạp và lưu bền vững slide: ' + f.name);
        (S.view === 'create' ? create : home)();
      };
      reader.readAsDataURL(f);
      return;
    }
    if (S.pdf && S.pdf.startsWith('blob:')) URL.revokeObjectURL(S.pdf);
    S.pdf = URL.createObjectURL(f);
    toast('✓ Đã nạp slide: ' + f.name);
  } else if (x === 'pptx') {
    toast('Hãy xuất file PPTX sang PDF để xem trực tiếp trên khung trình chiếu.');
  } else {
    toast('Vui lòng chọn file định dạng PDF hoặc PPTX.');
  }
  (S.view === 'create' ? create : home)();
}

function handleAudioUpload(file) {
  const title = file.name.replace(/\.[^.]+$/, '');
  const audioUrl = URL.createObjectURL(file);
  S.audioUrl = audioUrl;
  S.name = title;
  S.subj = 'Kinh tế vi mô';
  S.segs = dsegs();
  toast('🎙 Đang bóc băng âm thanh từ file “' + file.name + '”…');
  process('Audio Uploaded', audioUrl);
}

const warn = () => {
  S.live = false;
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  try { rec && rec.stop(); } catch {}
  micUI();
  const w = $('#mw');
  if (w) w.hidden = false;
};

function mic() {
  if (S.live) {
    stopAll();
    S.interim = '';
    drawTr();
    return micUI();
  }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!R) return toast('Trình duyệt này chưa hỗ trợ Web Speech API. Hãy dùng Chrome/Edge, hoặc bấm “Phát bài giảng mẫu”.');
  rec = new R();
  rec.lang = P.lang;
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = e => {
    let p = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) {
        S.interim = '';
        addSeg(r[0].transcript.trim());
      } else {
        p += r[0].transcript;
      }
    }
    S.interim = p;
    drawTr();
  };
  rec.onend = () => { if (S.live) try { rec.start(); } catch {} };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') warn();
  };
  S.live = true;
  S.t0 = S.t0 || Date.now();
  try { rec.start(); } catch {}
  micUI();
  S.timer = setInterval(() => {
    const mtm = $('#mtm');
    if (mtm && S.live) mtm.textContent = '⏱ Thời lượng: ' + fmt(Date.now() - S.t0) + ' · Đang neo tại Slide ' + S.slide;
  }, 1000);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) warn();
  else navigator.mediaDevices.getUserMedia({ audio: true }).then(s => s.getTracks().forEach(t => t.stop())).catch(warn);
}

function mk(sh) {
  const curLec = P.lec.find(x => x.id == S.curLecId);
  const T = (!S.pdf && curLec && curLec.demo) ? allTerms() : [];
  const fm = n => (S.segs.find(s => s.slide === n) || { ms: 0 }).ms;
  if (T.length) {
    S.cards = T.map(t => ({ f: t.term, b: t.def, slide: t.slide, ms: fm(t.slide) }));
    S.quiz = T.map(t => {
      const distractors = T.filter(x => x.term !== t.term).map(x => x.term);
      const opts = sh([t.term, ...sh(distractors).slice(0, 3)]);
      return {
        q: 'Khái niệm nào được mô tả: “' + t.def + '”?',
        opts,
        a: t.term,
        slide: t.slide,
        ms: fm(t.slide)
      };
    });
  } else {
    const cleanWord = w => w.replace(/[.,;?!""''()]/g, '');
    const W = s => s.text.split(/\s+/).map(cleanWord).filter(w => w.length > 3).sort((a, b) => b.length - a.length)[0];
    const L = S.segs.filter(W).slice(0, 6);
    const fallbackPool = ['ngân sách', 'thị trường', 'cân bằng', 'chi phí', 'lợi ích', 'khách quan'];
    const maskWord = (sentence, word) => {
      const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return sentence.replace(new RegExp(escaped, 'i'), '_____');
    };
    S.cards = L.map(s => {
      const target = W(s);
      return { f: maskWord(s.text, target), b: target + ' — ' + s.text, slide: s.slide, ms: s.ms };
    });
    S.quiz = L.map(s => {
      const target = W(s);
      const others = [...new Set([...L.map(W), ...fallbackPool])].filter(w => w && w.toLowerCase() !== target.toLowerCase()).slice(0, 3);
      return {
        q: 'Điền từ còn thiếu vào câu giảng: “' + maskWord(s.text, target) + '”',
        opts: sh([target, ...others]),
        a: target,
        slide: s.slide,
        ms: s.ms
      };
    });
  }
  S.fi = 0;
  S.flip = 0;
}

function drawPack() {
  const p = $('#pk');
  if (!p) return;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === S.tab));

  if (S.tab === 'map') return dMap(p);
  if (S.tab === 'flash') return dFlash(p);

  if (S.tab === 'notes') {
    const by = {};
    S.segs.forEach(s => (by[s.slide] ??= []).push(s));
    const ks = Object.keys(by).map(Number).sort((a, b) => a - b);
    p.innerHTML = ks.length
      ? `<div class="between" style="margin-bottom:10px">
          <div class="row">
            <button class="jump ${S.sl === 'vi' ? 'active' : ''}" data-a="sl" data-v="vi">🇻🇳 Tiếng Việt</button>
            <button class="jump ${S.sl === 'en' ? 'active' : ''}" data-a="sl" data-v="en">🇬🇧 English</button>
          </div>
          <small class="muted">${ks.length} phần ghi chú</small>
        </div>` +
        ks.map(n => {
          const sl = !S.pdf && S.deck.slides[n - 1];
          const tm = !S.pdf && allTerms().find(x => x.slide === n);
          return `<article class="note">
            <h3>${esc(sl ? sl.t : 'Slide ' + n)}</h3>
            ${tm ? `<p class="def">💡 <b>${esc(tm.term)}:</b> ${esc(tm.def)}</p>` : ''}
            ${by[n].map(s => `<p>${esc(S.sl === 'en' && s.en ? s.en : s.text)}</p>`).join('')}
            <div class="row" style="margin-top:10px">
              <button class="jump" data-a="jump" data-n="${n}">📍 Slide ${n} · ${fmt(by[n][0].ms)}</button>
              <button class="jump" data-a="tts" data-n="${n}">🔊 Đọc to</button>
            </div>
          </article>`;
        }).join('')
      : '<div class="note"><p class="muted">Chưa có dữ liệu lời giảng cho bài này. Hãy bấm “Bắt đầu ghi âm” để thu thập phụ đề hoặc phát bài mẫu.</p><button class="pri" style="margin-top:8px" data-a="newlive">🎙 Vào phòng Live</button></div>';
    return;
  }

  // Quiz tab
  if (S.quiz.length) {
    const N = S.quiz.length;
    const n = Object.keys(S.picked).length;
    const ok = S.quiz.filter((q, i) => S.picked[i] !== undefined && q.opts[S.picked[i]] === q.a).length;
    const r = ok / N;
    const msg = n < N
      ? `Đã trả lời ${n}/${N} câu · Đúng ${ok}`
      : r >= .8
        ? `🎉 Xuất sắc! Đúng ${ok}/${N} câu (${Math.round(r * 100)}%)`
        : r >= .5
          ? `👍 Khá tốt! Đúng ${ok}/${N} câu. Ôn lại các câu sai nhé!`
          : `🌱 Đúng ${ok}/${N} câu. Hãy lật lại Flashcard để nắm chắc hơn!`;

    p.innerHTML = `
      <div class="score" role="status">
        <span>${msg}</span>
        ${n > 0 ? `<button class="jump" style="margin:0" data-a="retryquiz">🔄 Làm lại</button>` : ''}
      </div>` +
      S.quiz.map((q, i) => {
        const s = S.picked[i];
        return `<article class="note">
          <b>Câu ${i + 1}. ${esc(q.q)}</b>
          ${q.opts.map((o, j) => {
            const c = s === undefined ? '' : o === q.a ? 'ok' : j === s ? 'bad' : 'dim';
            return `<button class="opt ${c}" ${s !== undefined ? 'disabled' : ''} data-a="pick" data-q="${i}" data-o="${j}">${esc(o)}</button>`;
          }).join('')}
          ${s !== undefined ? `<button class="jump" data-a="src" data-s="${q.slide}" data-m="${q.ms}">▶ Xem slide &amp; nghe đoạn gốc</button>` : ''}
        </article>`;
      }).join('');
  } else {
    p.innerHTML = '<p class="muted">Chưa có câu hỏi trắc nghiệm cho bài này. Hãy thu âm lời giảng hoặc mở bài mẫu Kinh tế vi mô.</p>';
  }
}

function exportNotes() {
  if (!S.segs.length) return toast('Chưa có nội dung ghi chú để xuất file.');
  const curLec = P.lec.find(x => x.id == S.curLecId);
  const title = curLec ? curLec.title : S.deck.title;
  const by = {};
  S.segs.forEach(s => (by[s.slide] ??= []).push(s));
  const ks = Object.keys(by).map(Number).sort((a, b) => a - b);

  let md = `# ${title} — EaseStudy Smart Notes\nNgày xuất: ${new Date().toLocaleDateString('vi-VN')}\n\n`;
  ks.forEach(n => {
    const sl = !S.pdf && S.deck.slides[n - 1];
    const tm = !S.pdf && allTerms().find(x => x.slide === n);
    md += `## Slide ${n}${sl ? ': ' + sl.t : ''}\n`;
    if (tm) md += `> **Thuật ngữ (${tm.term}):** ${tm.def}\n\n`;
    by[n].forEach(s => {
      md += `- [${fmt(s.ms)}] ${S.sl === 'en' && s.en ? s.en : s.text}\n`;
    });
    md += '\n';
  });

  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${title.toLowerCase().replace(/\s+/g, '-')}-notes.md`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('✓ Đã tải xuống file ghi chú (.md)');
}

/* Helpers: Modal, Speech, Lecture Actions */
function modal(h) {
  const m = $('#modal');
  if (!h) {
    m.hidden = true;
    m.innerHTML = '';
    return;
  }
  m.innerHTML = `<div class="md" data-a="x">${h}</div>`;
  m.hidden = false;

}

function say(t, l) {
  if (!('speechSynthesis' in window)) return toast('Trình duyệt của bạn chưa hỗ trợ đọc văn bản (TTS).');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = l;
  speechSynthesis.speak(u);
}

function src(s, m) {
  go(+s);
  const g = S.segs.find(x => x.slide == s && x.ms == m) || S.segs.find(x => x.slide == s);
  if (g) {
    say(g.text, P.lang);
    toast('🔊 Đang đọc lại câu giảng ở Slide ' + s);
  }
}

function openLec(id, tab) {
  const l = P.lec.find(x => x.id == id);

    title: l.title,
    slides: [
      { t: l.title + ' — Phần 1', b: ['Khái niệm nền tảng và định nghĩa cốt lõi', 'Mối quan hệ biện chứng giữa các thành tố'] },

  };

    S.pdf = null;

const MS = '<svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true"><line x1="24" y1="3" x2="24" y2="11" stroke="#fff" stroke-width="2"/><circle cx="24" cy="4" r="3" fill="#FBBF24"/><rect x="6" y="11" width="36" height="28" rx="12" fill="#fff"/><rect x="10" y="16" width="28" height="18" rx="9" fill="#2563EB"/><circle class="ey" cx="19" cy="25" r="3" fill="#fff"/><circle class="ey" cx="29" cy="25" r="3" fill="#fff"/><path d="M20 30q4 3 8 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const QC = ['📌 Tóm tắt sâu slide này', '📐 Giải thích kèm công thức', '📝 Ra 3 câu trắc nghiệm', '🎯 Phân tích ví dụ thực tế'];

function chit(q) {
  const l = q.toLowerCase().trim();
  const R = a => a[Math.floor(Math.random() * a.length)];
  if (/^(xin )?chào|^hello|^hi$|^hey|^alo/.test(l)) return R(['Chào ' + P.name + '! Mình là Ease Copilot 2.0. Bạn có thể gõ câu hỏi, đính kèm tài liệu (📎) hoặc bấm nút Micro (🎙) để nói chuyện trực tiếp với mình nhé!', 'Hey ' + P.name + '! Hôm nay chúng ta cùng chinh phục môn học nào đây?']);
  if (/khỏe không|khoẻ không|how are you|dạo này (sao|thế nào)/.test(l)) return 'Hệ thống Neural Engine của mình đang hoạt động ở mức 100% công suất! Còn bạn thì sao, sẵn sàng ôn tập chưa?';
  if (/bạn là ai|tên gì|who are you/.test(l)) return 'Mình là Ease Copilot 2.0 🤖 — trợ lý học thuật đa phương thức của EaseStudy. Mình nhận diện được cả văn bản, file tài liệu đính kèm và bản ghi âm giọng nói của bạn!';
  if (/cảm ơn|cám ơn|thanks|thank you/.test(l)) return R(['Rất sẵn lòng! Chúc bạn bứt phá điểm A+ học kỳ này nhé 😊', 'Không có chi! Cần phân tích thêm slide hay file nào cứ gửi cho mình.']);
  if (/chán|buồn|mệt|stress|áp lực|nản/.test(l)) return 'Áp lực thi cử là điều ai cũng trải qua. Bạn hãy áp dụng quy tắc Pomodoro: nghỉ ngơi 5 phút, uống chút nước ấm, sau đó gửi slide khó nhất vào đây để mình tóm tắt ngắn gọn cho bạn nhé!';
  return '';
}

function bot(q, attachedFile, isVoice) {
  const modePrefix = {
    tutor: '🎓 [Chế độ Học thuật chuyên sâu]',
    exam: '✅ [Chế độ Luyện thi & Giải bài tập]',
    socratic: '💡 [Chế độ Gợi mở Socratic]'
  }[S.aiMode] || '🎓 [Ease AI Copilot]';

  if (attachedFile) {
    const ext = attachedFile.name.split('.').pop().toLowerCase();
    const isAudio = ['mp3', 'wav', 'm4a', 'ogg'].includes(ext);
    const isDoc = ['pdf', 'docx', 'doc', 'txt', 'pptx'].includes(ext);
    return `${modePrefix}\nĐã phân tích xong file đính kèm: “${attachedFile.name}” (${(attachedFile.size / 1024).toFixed(1)} KB).\n\n` +
      (isAudio
        ? `🎙 Kết quả bóc băng AI:\n• Nội dung trọng tâm: Phân tích mối quan hệ giữa Thỏa dụng biên (MU), Đường bàng quan và cân bằng tiêu dùng.\n• Gợi ý: Bạn có thể bấm nút “+ Tải file ghi âm” ở màn hình chính để tạo trọn bộ Flashcard từ file âm thanh này!`
        : isDoc
          ? `📑 Tóm tắt cấu trúc tài liệu:\n1. Luận điểm cốt lõi: Tối đa hóa lợi ích dưới ràng buộc ngân sách hữu hạn (Px·X + Py·Y = I).\n2. Công thức cần nhớ: MUx / Px = MUy / Py.\n3. Câu hỏi trọng tâm: ${q || 'Tài liệu đã được đối chiếu khớp với Slide ' + S.slide + '.'}`
          : `🖼 Đã quét hình ảnh/tài liệu đính kèm và trích xuất các khái niệm liên quan tới Slide ${S.slide}. ${q ? 'Trả lời cho câu hỏi của bạn: Các đường bàng quan lồi về gốc tọa độ do tỷ lệ thay thế biên MRS giảm dần.' : ''}`);
  }

  if (isVoice && !q) {
    return `${modePrefix}\n🎙 Đã nhận bản ghi âm giọng nói của bạn!\n• Nội dung AI nhận diện được: “Giải thích trọng tâm kiến thức của Slide ${S.slide} và cho ví dụ thực tế.”\n• Giải đáp: Ở Slide ${S.slide}, nguyên lý cốt lõi là người tiêu dùng cân nhắc giữa lợi ích tăng thêm (MU) và chi phí bỏ ra (P). Ví dụ: Khi mua ly cà phê thứ 2 trong buổi sáng, mức độ tỉnh táo tăng thêm thấp hơn ly đầu tiên (MU giảm dần).`;
  }

  const c = chit(q);
  if (c) return c;
  const l = q.toLowerCase();
  const sl = !S.pdf && S.deck.slides[S.slide - 1];
  const T = S.pdf ? [] : allTerms();
  const here = S.segs.filter(s => s.slide === S.slide);

  if (l.includes('tóm tắt')) {
    if (!sl && !here.length) return `${modePrefix}\nSlide ${S.slide} hiện chưa có dữ liệu văn bản để tóm tắt.`;
    return `${modePrefix}\n📌 Tóm tắt cấu trúc Slide ${S.slide}${sl ? ' — ' + sl.t : ''}:\n• ${sl ? sl.b.join('\n• ') : ''}${here.length ? '\n\n🎙 Lời giảng đã ghi nhận:\n“' + here.slice(0, 2).map(s => s.text).join(' ') + '”' : ''}\n\n💡 Kết luận: Nắm vững mối liên hệ giữa biến số lượng (Q) và lợi ích cận biên (MU).`;
  }
  if (/công thức|giải thích|phân tích|ví dụ/.test(l)) {
    const hit = T.find(t => t.slide === S.slide) || T[0];
    const ext = EXT[S.slide - 1] || EXT[0];
    return `${modePrefix}\n📘 Trọng tâm Slide ${S.slide}: ${hit ? hit.term : 'Lý thuyết người tiêu dùng'}\n• Định nghĩa: ${hit ? hit.def : ''}\n• ${ext.x}\n• Ví dụ thực tiễn: Khi giá hàng hóa X giảm, thặng dư tiêu dùng (CS) tăng lên do khoảng cách giữa mức sẵn sàng trả (WTP) và giá thực trả được nới rộng.`;
  }
  if (/câu hỏi|ôn tập|quiz|kiểm tra|trắc nghiệm/.test(l)) {
    const A = T.filter(t => t.slide === S.slide);
    const L = (A.length ? A : T).slice(0, 3);
    return `${modePrefix}\n📝 Bộ câu hỏi trắc nghiệm nhanh cho bạn:\n` +
      L.map((t, i) => `Câu ${i + 1}: “${t.def}” là khái niệm nào?`).join('\n') +
      `\n\n🔑 Đáp án chuẩn: ` + L.map((t, i) => `${i + 1}) ${t.term}`).join(' | ');
  }
  const hit = [...T].sort((a, b) => b.term.length - a.term.length).find(t => {
    const k = t.term.toLowerCase();
    return l.includes(k) || l.includes(k.replace(/\s*\(.*\)/, ''));
  });
  if (hit) {
    const e = EXT.find(x => hit.term.toLowerCase().includes(x.k));
    return `${modePrefix}\n📘 ${hit.term} (Slide ${hit.slide}):\n${hit.def}${e ? '\n\n✨ ' + e.x : ''}`;
  }
  return `${modePrefix}\nVề vấn đề “${q}” ở Slide ${S.slide}:\nTrong kinh tế học vi mô, mọi quyết định tối ưu đều dựa trên việc so sánh Lợi ích cận biên (Marginal Benefit) và Chi phí cận biên (Marginal Cost). Bạn có thể đính kèm thêm file bài tập (nút 📎) hoặc bấm ghi âm (🎙) để mình giải chi tiết từng bước nhé!`;
}

function sendChatPayload(textInput, isVoiceNote = false) {
  const q = (textInput || '').trim();
  const file = S.chatFile;
  if (!q && !file && !isVoiceNote) return;

  let userHtml = '';
  if (file) {
    userHtml += `<div class="chat-att-card">📎 <span>${esc(file.name)} (${(file.size / 1024).toFixed(1)} KB)</span></div>`;
  }
  if (isVoiceNote) {
    userHtml += `<div class="chat-att-card">🎙 <span>Bản ghi âm giọng nói (${fmt(S.chatRecSec * 1000)})</span></div>`;
  }
  if (q) userHtml += `<div>${esc(q)}</div>`;

  cmsg('u', userHtml);

  // Clear tray
  S.chatFile = null;
  const tray = $('#ctray');
  if (tray) tray.hidden = true;
  const cfile = $('#cfile');
  if (cfile) cfile.value = '';

  cmsg('b', '<span class="spin"></span> Ease AI Copilot đang phân tích dữ liệu…');
  const m = $('#cm');
  const w = m.lastElementChild;
  setTimeout(() => {
    w.innerHTML = esc(bot(q, file, isVoiceNote));
    m.scrollTop = m.scrollHeight;
  }, 550);
}

  btn.classList.add('rec-on');
  $('#crectm').textContent = 'Đang ghi âm: 00:00';

  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (R) {
    try {
      chatSpeechRec = new R();
      chatSpeechRec.lang = P.lang;
      chatSpeechRec.continuous = true;
      chatSpeechRec.interimResults = true;
      chatSpeechRec.onresult = ev => {
        let txt = '';
        for (let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
        if (txt) $('#ci').value = txt;
      };
      chatSpeechRec.start();
    } catch {}
  }

  clearInterval(S.chatRecTimer);
  S.chatRecTimer = setInterval(() => {
    S.chatRecSec++;
    $('#crectm').textContent = 'Đang ghi âm: ' + fmt(S.chatRecSec * 1000);
  }, 1000);
}

function stopChatVoiceRec(shouldSend) {
  S.chatRec = false;
  clearInterval(S.chatRecTimer);
  if (chatSpeechRec) {
    try { chatSpeechRec.stop(); } catch {}
    chatSpeechRec = null;
  }
  $('#crecbar').hidden = true;
  $('#cmicbtn').classList.remove('rec-on');
  if (shouldSend) {
    const i = $('#ci');
    sendChatPayload(i.value, true);
    i.value = '';
  }
}

function positionTourSpotlight() {
  const sp = $('#sp'), b = $('#bub'), tb = $('#tb');
  if (!sp || !b || !tb) return;
  const d = TS[ti];
  const el = d ? document.querySelector(d.s) : null;
  let low = false;
  if (el) {
    const r = el.getBoundingClientRect();
    const p = 8;
    Object.assign(sp.style, {
      display: 'block',
      left: Math.max(4, r.left - p) + 'px',
      top: Math.max(4, r.top - p) + 'px',
      width: Math.min(window.innerWidth - 8, r.width + 2 * p) + 'px',
      height: r.height + 2 * p + 'px'
    });
    tb.style.background = 'transparent';
    low = (r.top + r.height / 2) < (window.innerHeight / 2);
  } else {
    sp.style.display = 'none';
    tb.style.background = 'rgba(0,0,0,.7)';
  }
  b.style.top = low ? 'auto' : 'calc(16px + env(safe-area-inset-top,0px))';
  b.style.bottom = low ? 'calc(16px + env(safe-area-inset-bottom,0px))' : 'auto';
}

function tour(i) {
  ti = i;
  TS[i].pre();
  if (!$('#tb')) {
    document.body.insertAdjacentHTML('beforeend', '<div id="tb"></div><div id="sp"></div><div id="bub" role="dialog" aria-live="polite"></div>');
  }
  setTimeout(() => {
    const d = TS[i];
    const el = document.querySelector(d.s);
    if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    setTimeout(() => {
      positionTourSpotlight();
      const b = $('#bub');
      if (b) {
        b.innerHTML = `
          <div class="mas">${MS}</div>
          <p style="margin:0 0 12px;font-weight:500">${esc(d.t)}</p>
          <div class="row">
            <small class="muted" style="font-weight:700">${i + 1} / ${TS.length}</small>
            <button class="ghost" style="padding:7px 12px;font-size:.82rem" data-a="tskip">Bỏ qua</button>
            <span style="flex:1"></span>
            ${i ? '<button class="ghost" style="padding:7px 12px;font-size:.82rem" data-a="tprev">Quay lại</button>' : ''}
            <button class="pri" style="padding:8px 16px;font-size:.88rem" data-a="tnext">${i < TS.length - 1 ? 'Tiếp tục →' : 'Hoàn tất'}</button>
          </div>`;
      }
    }, 180);
  }, 60);
}

function endTour() {
  ['tb', 'sp', 'bub'].forEach(i => { const e = $('#' + i); if (e) e.remove(); });
  P.tour = 1;
  save();
  home();
}

window.addEventListener('resize', () => { if ($('#sp')) positionTourSpotlight(); });
window.addEventListener('scroll', () => { if ($('#sp')) positionTourSpotlight(); }, { passive: true });

      <span class="k">${g ? 'Start your' : 'Welcome'}</span>
      <h1 class="big">${g ? 'LEARNING' : 'BACK'}<span>${g ? 'now!' : 'learner!'}</span></h1>

function showAuth() {

function login(u) {
  P.user = u;
  P.name = u.name || 'Learner';

  $('#auth').hidden = true;

  if (!P.tour) setTimeout(() => tour(0), 600);

/* Unified Action Dispatcher */
const ACTIONS = {
  home,
  create,
  lectures,
  materials,
  pricing,
  settings,
  help,
  cmd: openCmdPalette,
  addterm: addTermModal,
  saveterm: () => {
    const term = ($('#nt_term')?.value || '').trim();
    const def = ($('#nt_def')?.value || '').trim();
    const slide = Math.max(1, parseInt($('#nt_sl')?.value || '1', 10));
    if (!term || !def) return toast('Vui lòng nhập đủ tên thuật ngữ và định nghĩa.');
    P.customTerms.push({ term, def, slide });
    save();
    modal();
    toast('✓ Đã bổ sung thuật ngữ “' + term + '”');
    if (S.view === 'materials') materials();
  },
  export: exportNotes,
  close: () => modal(),
  prev: () => go(S.slide - 1),
  next: () => go(S.slide + 1),
  zo: () => { S.zoom = Math.max(50, S.zoom - 25); drawSlide(); },
  zi: () => { S.zoom = Math.min(200, S.zoom + 25); drawSlide(); },
  full: () => {
    const v = $('#vwrap');
    if (!v) return;
    if (!document.fullscreenElement) v.requestFullscreen?.();
    else document.exitFullscreen?.();
  },
  file: () => $('#fs')?.click(),
  clearpdf: () => {
    if (S.pdf && S.pdf.startsWith('blob:')) URL.revokeObjectURL(S.pdf);
    S.pdf = null;
    S.name = '';
    toast('Đã chuyển về bộ slide mẫu.');
    create();
  },
  audio: () => $('#fa')?.click(),
  newlive: create,
  mic,
  demo: playDemo,
  finish: () => S.segs.length ? process() : toast('Hãy thu âm ít nhất 1 câu hoặc bấm “Phát bài giảng mẫu” trước khi tổng hợp.'),
  begin: () => {
    if (P.used >= P.cap) {
      toast('Bạn đã dùng hết hạn mức gói ' + P.plan + '. Hãy nâng cấp để tạo thêm bài giảng!');
      return pricing();
    }
    S.subj = $('#cs') ? $('#cs').value : S.subj;
    S.kw = $('#ck') ? $('#ck').value.trim() : S.kw;
    live(true);
  },
  open: el => openLec(el.dataset.id, el.dataset.t),
  dellec: el => {
    const id = el.dataset.id;
    P.lec = P.lec.filter(x => String(x.id) !== String(id));
    save();
    toast('Đã xóa bài giảng.');
    lectures();
  },
  editseg: el => {
    const idx = +el.dataset.i;
    const seg = S.segs[idx];
    if (!seg) return;
    modal(`
      <h3>Chỉnh sửa câu giảng (Slide ${seg.slide})</h3>
      <input id="ed_seg_in" value="${esc(seg.text)}">
      <div class="row" style="justify-content:center;margin-top:6px">
        <button class="ghost" data-a="close">Huỷ</button>
        <button class="pri" id="ed_seg_sv">Lưu thay đổi</button>
      </div>`);
    $('#ed_seg_sv').onclick = () => {
      const val = ($('#ed_seg_in')?.value || '').trim();
      if (val) {
        seg.text = val;
        const curLec = P.lec.find(x => x.id == S.curLecId);
        if (curLec && curLec.segs) save();
        modal();
        if (S.view === 'live') drawTr();
        if (S.view === 'review') {
          const sh = a => a.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
          mk(sh);
          drawPack();
        }
        toast('✓ Đã cập nhật câu phụ đề.');
      }
    };
  },
  delseg: el => {
    const idx = +el.dataset.i;
    S.segs.splice(idx, 1);
    drawTr();
  },
  jump: el => go(+el.dataset.n),
  tab: el => { S.tab = el.dataset.v; drawPack(); },
  pick: el => { S.picked[el.dataset.q] = +el.dataset.o; drawPack(); },
  retryquiz: () => { S.picked = {}; drawPack(); },
  line: el => { S.sel = +el.dataset.i; go(S.segs[S.sel].slide); dMap($('#pk')); },
  src: el => src(el.dataset.s, el.dataset.m),
  tts: el => say(S.segs.filter(s => s.slide === +el.dataset.n).map(s => S.sl === 'en' && s.en ? s.en : s.text).join('. '), S.sl === 'en' ? 'en-US' : 'vi-VN'),
  sl: el => { S.sl = el.dataset.v; drawPack(); },
  flip: () => { S.flip = !S.flip; drawPack(); },
  fp: () => { S.fi = (S.fi + S.cards.length - 1) % S.cards.length; S.flip = 0; drawPack(); },
  fn: () => { S.fi = (S.fi + 1) % S.cards.length; S.flip = 0; drawPack(); },
  buy: el => buy(+el.dataset.i),
  paid: el => pay(+el.dataset.i),
  reset: () => {
    try { localStorage.removeItem('es'); } catch {}
    location.reload();
  },
  mictest: async () => {
    const r = $('#mr');
    if (!r) return;
    r.textContent = 'Đang kiểm tra…';
    try {
      const st = await navigator.mediaDevices.getUserMedia({ audio: true });
      st.getTracks().forEach(t => t.stop());
      r.textContent = '✓ Micro hoạt động tốt!';
      r.style.color = 'var(--green)';
    } catch {
      r.textContent = '✕ Không truy cập được Micro. Hãy cấp quyền trên trình duyệt.';
      r.style.color = 'var(--danger)';
    }
  },
  menu: () => {
    const o = $('.side').classList.toggle('open');
    $('#ov').classList.toggle('on', o);
    $('#mb').setAttribute('aria-expanded', o);
  },
  tour: () => { closeMenu(); tour(0); },
  tnext: () => ti < TS.length - 1 ? tour(ti + 1) : endTour(),
  tprev: () => tour(ti - 1),
  tskip: endTour,
  chat: () => {
    const c = $('#chat');
    const o = c.hidden;
    c.hidden = !o;
    $('#cbtn').setAttribute('aria-expanded', o);
    if (o) $('#ci')?.focus();
  },
  chatwide: () => $('#chat')?.classList.toggle('wide'),
  aimode: el => {
    S.aiMode = el.dataset.m;
    document.querySelectorAll('.chat-modes button').forEach(b => b.classList.toggle('on', b.dataset.m === S.aiMode));
  },
  chatattach: () => $('#cfile')?.click(),
  rmchatfile: () => {
    S.chatFile = null;
    $('#ctray').hidden = true;
    $('#cfile').value = '';
  },
  chatmic: toggleChatVoiceRec,
  cancelchatrec: () => stopChatVoiceRec(false),
  sendchatrec: () => stopChatVoiceRec(true),
  chip: el => sendChatPayload(el.dataset.q, false),
  set: el => {
    D[el.dataset.k] = el.dataset.k === 'fs' ? +el.dataset.v : el.dataset.v;
    applyPrefs(D);
    drawSet();
  },
  scancel: () => { applyPrefs(P); settings(); },
  ssave: () => {
    D.name = (D.name || '').trim() || 'Learner';
    Object.assign(P, D);
    save();
    applyPrefs(P);
    toast('✓ Đã lưu cài đặt thành công.');
    settings();
  },
  logout: () => { P.user = null; save(); showAuth(); },
  amode: el => authUI(el.dataset.m),
  soc: el => {
    const v = el.dataset.v;
    el.disabled = true;
    el.innerHTML = '<span class="spin"></span> Đang kết nối…';
    setTimeout(() => login({ name: 'Learner', email: '', via: v }), 650);
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  if (ACTIONS[a]) ACTIONS[a](el);
});

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openCmdPalette();
    return;
  }
  if (e.key === 'Escape') {
    modal();
    if (!$('#chat').hidden) ACTIONS.chat();
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (S.view === 'live' || S.view === 'review') {
    if (e.key === 'ArrowLeft') {
      if (S.view === 'review' && S.tab === 'flash' && S.cards.length) ACTIONS.fp();
      else go(S.slide - 1);
    } else if (e.key === 'ArrowRight') {
      if (S.view === 'review' && S.tab === 'flash' && S.cards.length) ACTIONS.fn();
      else go(S.slide + 1);
    } else if (e.key === ' ' && S.view === 'review' && S.tab === 'flash' && S.cards.length) {
      e.preventDefault();
      ACTIONS.flip();
    }
  }
});

/* Boot Application */
applyPrefs(P);
updPlan();
home();
if (P.user) {
  if (!P.tour) setTimeout(() => tour(0), 600);
} else {
  showAuth();
}
</script>
